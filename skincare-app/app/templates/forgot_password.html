{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h2 class="mb-2">Forgot your password?</h2>
                    <p class="text-muted mb-4">
                        Enter your account email address and we'll send
                        you a password recovery link.
                    </p>
                    <form method="POST"
                          action="{{ url_for('auth.forgot_password') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email address
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required
                            >
                        </div>
                        <button type="submit"
                                class="btn btn-dark w-100">
                            Send Recovery Link
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="{{ url_for('auth.welcome') }}">
                            Back to login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Reset Password — AprilSkin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h2 class="mb-2">Create a new password</h2>

                <p class="text-muted mb-4">
                    Choose a new password for your AprilSkin account.
                </p>

                <div id="status" class="alert alert-info">
                    Verifying your recovery link...
                </div>

                <form id="resetForm" hidden>
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            New password
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm new password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        id="submitButton"
                        class="btn btn-dark w-100"
                    >
                        Update Password
                    </button>
                </form>

                <a href="{{ url_for('auth.welcome') }}"
                   class="text-center mt-4">
                    Back to login
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = {{ supabase_url | tojson }};
    const SUPABASE_ANON_KEY = {{ supabase_anon_key | tojson }};

    const statusBox = document.getElementById("status");
    const resetForm = document.getElementById("resetForm");
    const submitButton = document.getElementById("submitButton");

    // Capture the recovery marker before Supabase processes the URL.
    const initialHash = new URLSearchParams(
        window.location.hash.substring(1)
    );

    const isRecoveryLink = initialHash.get("type") === "recovery";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    let recoveryReady = false;

    function showStatus(message, type = "info") {
        statusBox.textContent = message;
        statusBox.className = "alert alert-" + type;
        statusBox.hidden = false;
    }

    function enableResetForm() {
        recoveryReady = true;
        resetForm.hidden = false;
        statusBox.hidden = true;
    }

    // Listen for Supabase's password recovery event.
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
            enableResetForm();
        }
    });

    async function initializeResetPage() {
        // Allow Supabase time to process the recovery URL.
        await new Promise(resolve => setTimeout(resolve, 500));

        const { data, error } = await supabaseClient.auth.getSession();

        if (error || !data.session) {
            showStatus(
                "This reset link is invalid or has expired. Please request a new one.",
                "danger"
            );
            return;
        }

        // Require a recovery link, not merely an existing session.
        if (isRecoveryLink) {
            enableResetForm();
        } else if (!recoveryReady) {
            showStatus(
                "Please open the password reset link from your email.",
                "warning"
            );
        }
    }

    initializeResetPage();

    resetForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        if (!recoveryReady) {
            showStatus(
                "Your recovery session could not be verified. Request a new reset link.",
                "danger"
            );
            return;
        }

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            showStatus(
                "Your password must contain at least 8 characters.",
                "danger"
            );
            return;
        }

        if (password !== confirmPassword) {
            showStatus("Your passwords do not match.", "danger");
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Updating password...";

        try {
            const { error } = await supabaseClient.auth.updateUser({
                password: password
            });

            if (error) {
                showStatus(
                    error.message || "We couldn't update your password.",
                    "danger"
                );
                return;
            }

            // Clear the recovery session after a successful reset.
            await supabaseClient.auth.signOut();

            showStatus(
                "Your password has been updated successfully. You can now sign in.",
                "success"
            );

            resetForm.hidden = true;

            setTimeout(() => {
                window.location.href = {{ url_for("auth.welcome") | tojson }};
            }, 2000);

        } catch (error) {
            showStatus(
                "Something went wrong. Please request a new reset link if necessary.",
                "danger"
            );
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Update Password";
        }
    });
</script>
{% endblock %}
